<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haiqal Dwikusuma</title>
<meta name="description" content="Portfolio of Muhammad Haiqal Dwikusuma, Computer Science graduate (UGM) and front-end developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* --accent animates smoothly because it is a registered colour property */
  @property --accent { syntax:'<color>'; inherits:true; initial-value:#FF5A1F; }
  @property --on     { syntax:'<color>'; inherits:true; initial-value:#FFFFFF; }
  @property --a2     { syntax:'<color>'; inherits:true; initial-value:#3D5BFF; }
  @property --a3     { syntax:'<color>'; inherits:true; initial-value:#FF3D8B; }

  :root{
    --bg:#0F0E13; --surface:#1A1922; --surface2:#24222E; --text:#F6F2EA; --muted:#A39FB0; --line:rgba(255,255,255,.09);
    --brand:#FF5A1F; --cobalt:#3D5BFF; --pink:#FF3D8B; --sun:#FFC531;
    --accent:#FF5A1F; --on:#FFFFFF;
    --radius:32px; --ease:cubic-bezier(.2,.8,.2,1);
    transition:--accent .6s var(--ease), --on .6s var(--ease), --a2 .9s var(--ease), --a3 .9s var(--ease);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.02em}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  img{display:block;max-width:100%}

  .app{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr 1fr;gap:20px;height:100vh;padding:20px}

  /* FULL GLASS: soft colour glow behind the menu, taken from the current section's photos */
  .aura{position:fixed;top:0;right:0;bottom:0;width:60%;z-index:0;overflow:hidden;pointer-events:none;
        -webkit-mask-image:linear-gradient(to right,transparent,#000 30%);mask-image:linear-gradient(to right,transparent,#000 30%)}
  .aura i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
  .aura .b1{width:60%;aspect-ratio:1;right:-10%;top:30%;background:var(--accent)}
  .aura .b2{width:50%;aspect-ratio:1;left:5%;top:-8%;background:var(--a2);animation-delay:-5s}
  .aura .b3{width:46%;aspect-ratio:1;left:20%;bottom:-12%;background:var(--a3);animation-delay:-10s}
  @keyframes drift{to{transform:translate(-10%,8%) scale(1.15)}}

  /* ---------- STAGE ---------- */
  .stage{position:relative;border-radius:var(--radius);background:var(--brand);overflow:hidden;perspective:1200px}
  .stage.clickable{cursor:pointer}
  .stage-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out}
  .view{position:absolute;inset:0;opacity:0;transform:scale(.985);transition:opacity .45s var(--ease),transform .45s var(--ease);pointer-events:none}
  .view.active{opacity:1;transform:none;pointer-events:auto}

  /* home */
  .layer{position:absolute;inset:0;transition:transform .2s ease-out;will-change:transform}
  .ring{position:absolute;left:50%;top:52%;width:min(74%,560px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;
        background:conic-gradient(from 0deg,var(--cobalt),var(--pink),var(--sun),var(--cobalt));animation:spin 24s linear infinite}
  .ring::after{content:"";position:absolute;inset:13%;border-radius:50%;background:var(--brand)}
  @keyframes spin{to{rotate:360deg}}
  .person{position:absolute;left:50%;bottom:0;height:min(84%,640px);max-width:82%;object-fit:contain;object-position:bottom;translate:-50% 0;
          -webkit-mask-image:linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%)}
  .chip{position:absolute;padding:9px 15px;border-radius:999px;background:var(--bg);color:var(--text);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
  .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}

  /* preview */
  .pv-bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,var(--accent),#0F0E13 75%)}
  .pv-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .7s var(--ease),transform 6s ease-out}
  .pv-bg img.on{opacity:1;transform:scale(1)}
  .pv-tint{position:absolute;inset:0;background:var(--accent);mix-blend-mode:multiply;opacity:.38}
  .pv-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,14,19,.78) 0%,rgba(15,14,19,.25) 38%,rgba(15,14,19,.3) 60%,rgba(15,14,19,.9) 100%)}
  .pv-head{position:absolute;left:36px;top:32px;right:36px;z-index:3}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .pv-head .kicker{color:#fff;opacity:.85}
  .pv-head h2{font-size:clamp(30px,3.4vw,48px);line-height:1.05;margin-top:8px;max-width:15ch;color:#fff}
  .pv-cta{position:absolute;right:28px;bottom:24px;z-index:4;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;background:var(--accent);color:var(--on)}

  /* GLASS sheet: frosted panel that sits half-open over the photo */
  .sheet{position:absolute;left:16px;right:16px;bottom:16px;height:58%;z-index:3;border-radius:28px;padding:12px 16px 70px;display:flex;flex-direction:column;
         background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
         border:1px solid rgba(255,255,255,.28);box-shadow:0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
         animation:sheetUp .7s var(--ease) backwards;transition:transform .5s var(--ease)}
  .sheet.dragging{transition:none}
  .sheet.collapsed{transform:translateY(calc(100% - 58px))}
  .sheet{-webkit-user-select:none;user-select:none;touch-action:none}
  @keyframes sheetUp{from{transform:translateY(108%)}to{transform:none}}
  /* the grab zone: drag (or click) to slide the sheet down and see the whole photo */
  .grab-zone{flex:none;height:46px;margin:-12px -16px 0;display:flex;align-items:center;justify-content:center;gap:10px;cursor:grab;touch-action:none;color:#fff;font-size:12px;font-weight:600}
  .grab-zone:active{cursor:grabbing}
  .grabber{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.5);transition:width .3s var(--ease),background .3s}
  .grab-zone:hover .grabber{width:60px;background:rgba(255,255,255,.85)}
  .peek{display:none;opacity:.85}
  .sheet.collapsed .peek{display:inline}
  .sheet .g-tiles,.sheet .pv-cta{transition:opacity .3s}
  .sheet.collapsed .g-tiles,.sheet.collapsed .pv-cta{opacity:0;pointer-events:none}
  .g-tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(64px,1fr);gap:10px;overflow:auto;scrollbar-width:none}
  .g-tile{text-align:left;color:#fff;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
          display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;
          transition:background .35s,border-color .35s,transform .35s var(--ease);animation:tileIn .5s var(--ease) both}
  .g-tile b{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(15px,1.4vw,18px);line-height:1.15}
  .g-tile span{font-size:12.5px;line-height:1.35;opacity:.82;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .g-tile.sel{background:color-mix(in srgb,var(--accent) 62%,transparent);border-color:var(--accent);transform:translateY(-2px)}
  @keyframes tileIn{from{opacity:0;transform:translateY(14px)}}
  .sheet .pv-cta{right:16px;bottom:14px}

  /* ---------- PANEL ---------- */
  .panel{display:flex;flex-direction:column;gap:22px;padding:14px 6px 4px;overflow:auto;min-height:0}
  .hello{font-size:15px;color:var(--muted);font-weight:500}
  .panel h1{font-size:clamp(40px,4.6vw,72px);line-height:.95;margin-top:6px}
  .panel h1 span{color:var(--accent)}
  .tagline{margin-top:12px;font-size:16px;color:var(--muted);line-height:1.5;max-width:44ch}
  /* LinkedIn-style "open to work" badge */
  .status{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:8px 16px 8px 12px;border-radius:999px;background:#2E7D32;color:#fff;font-size:14px;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 20px rgba(46,125,50,.35)}
  .status i{width:8px;height:8px;border-radius:50%;background:#B9F6CA;box-shadow:0 0 0 0 rgba(185,246,202,.7);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(185,246,202,0)}100%{box-shadow:0 0 0 0 rgba(185,246,202,0)}}

  .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;min-height:340px}
  .tile{position:relative;text-align:left;padding:16px 18px 14px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
        -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
        display:flex;flex-direction:column;justify-content:space-between;gap:12px;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s}
  .tile::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 82%,transparent);transform:translateY(101%);transition:transform .45s var(--ease)}
  .tile > *{position:relative}
  .tile .num{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .tile .num em{width:12px;height:12px;border-radius:50%;background:var(--c)}
  .tile .lbl{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(20px,1.9vw,28px);line-height:1}
  .tile .sub{display:block;font-size:13px;color:var(--muted);margin-top:6px}
  .tile .arrow{position:absolute;right:16px;bottom:12px;font-size:20px;opacity:0;transform:translate(-6px,6px);transition:.35s var(--ease)}
  .tile.wide{grid-column:span 2}
  .tile.on{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.35);color:var(--on)}
  .tile.on::before{transform:none}
  .tile.on .num,.tile.on .sub{color:var(--on);opacity:.8}
  .tile.on .num em{background:var(--on)}
  .tile.on .arrow{opacity:1;transform:none}
  .tile:focus-visible{outline:3px solid var(--text);outline-offset:3px}

  /* ---------- EXPANDED PAGE ---------- */
  .expand{position:fixed;inset:0;z-index:50;background:var(--bg);visibility:hidden;clip-path:inset(0 round 0);overflow:auto}
  .expand.anim{transition:clip-path .65s var(--ease)}
  .expand.show{visibility:visible}
  .x-close{position:fixed;top:22px;right:22px;z-index:60;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on);font-size:20px;opacity:0;pointer-events:none;transition:opacity .3s}
  .expand.ready ~ .x-close{opacity:1;pointer-events:auto}
  .hero{position:relative;height:46vh;min-height:300px;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover}
  .hero .pv-tint{opacity:.45}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,14,19,.1),var(--bg))}
  .hero.plain{height:22vh;min-height:140px;background:radial-gradient(90% 120% at 20% 0%,var(--accent),var(--bg) 70%)}
  .x-inner{position:relative;max-width:1100px;margin:-120px auto 0;padding:0 28px 110px;opacity:0;transform:translateY(24px);transition:opacity .4s .15s,transform .5s .15s var(--ease)}
  .expand.ready .x-inner{opacity:1;transform:none}
  .x-inner > h2{font-size:clamp(44px,6.4vw,92px);line-height:.95;margin:10px 0 22px}
  .x-inner > h2 span{color:var(--accent)}
  h3{font-size:26px;margin-bottom:6px}
  .lead{font-size:clamp(17px,1.6vw,20px);line-height:1.6;max-width:62ch;color:#DCD7CE}
  .muted{color:var(--muted)}
  .block{margin-top:56px}
  .block > p{max-width:64ch;line-height:1.6;color:#DCD7CE;margin-top:6px}
  .meta{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}
  .card{background:var(--surface);border-radius:24px;padding:22px;border:1px solid var(--line)}
  .card p,.card li{font-size:15px;line-height:1.55;color:#CFCAD8}
  .card ul{padding-left:18px;margin-top:10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--on);text-decoration:none;font-weight:600;font-size:14px}
  .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}

  /* photos: hovering one recolours the page to that photo's colour */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
  .ph{position:relative;margin:0;border-radius:18px;overflow:hidden;background:var(--surface);cursor:zoom-in;aspect-ratio:4/5;outline:3px solid transparent;outline-offset:3px;transition:outline-color .3s,transform .4s var(--ease)}
  .ph.land{aspect-ratio:16/10;grid-column:span 2}
  .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
  .ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;font-size:13px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
  .ph:hover{outline-color:var(--pc);transform:translateY(-3px)}
  .ph:hover img{transform:scale(1.05)}
  .ph::after{content:"";position:absolute;top:12px;right:12px;width:12px;height:12px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px rgba(0,0,0,.25)}

  .proj{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:center}
  .proj .ph{aspect-ratio:4/3;cursor:zoom-in}
  .proj .ph::after{display:none}
  .soon{aspect-ratio:4/3;border-radius:18px;display:grid;place-items:center;color:var(--muted);font-size:13px;background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 12px,var(--surface2) 12px,var(--surface2) 24px)}
  .timeline{margin-top:32px;border-left:2px solid var(--line);padding-left:30px;display:grid;gap:22px}
  .timeline .card{position:relative}
  .timeline .card::before{content:"";position:absolute;left:-41px;top:26px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid var(--bg)}
  .videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px;margin-top:18px}
  .vid-card h4{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;margin-top:12px}
  .vid-card p{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
  .ph.vid{aspect-ratio:16/9;cursor:pointer}
  .ph.vid figcaption{display:none}
  .ph.vid .play{position:absolute;left:50%;top:50%;translate:-50% -50%;width:64px;height:64px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
  .ph.vid:hover .play{transform:scale(1.1)}
  .ph.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ph.vid.playing{cursor:default;transform:none}
  .ph.vid.playing::after,.ph.vid.playing .play{display:none}
  .cv-frame{width:100%;height:80vh;border:0;border-radius:20px;background:#fff;margin-top:24px}
  .contact-list{display:grid;gap:14px;margin-top:28px}
  .contact-list a{display:flex;justify-content:space-between;align-items:center;padding:24px 26px;border-radius:24px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(20px,2.6vw,32px);font-weight:600;transition:transform .3s var(--ease),background .3s,color .3s}
  .contact-list a:hover{transform:translateX(6px);background:var(--accent);color:var(--on)}
  .contact-list small{font-family:Inter,sans-serif;font-size:13px;font-weight:500;opacity:.7;display:block}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:40px;background:color-mix(in srgb,var(--accent) 30%,#09080C);opacity:0;pointer-events:none;transition:opacity .35s}
  .lb.open{opacity:1;pointer-events:auto;cursor:zoom-out}
  .lb figure{display:grid;gap:14px;justify-items:center;max-height:100%}
  .lb img{max-height:calc(100vh - 140px);max-width:min(1100px,100%);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.96);transition:transform .45s var(--ease)}
  .lb.open img{transform:none}
  .lb figcaption{font-weight:600;color:#fff}

  /* ---------- small screens ---------- */
  @media (max-width:860px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;height:auto;padding:16px;gap:16px}
    .aura{width:100%}
    .stage{height:62vh;min-height:400px}
    .menu{min-height:0}
    .tile{min-height:112px}
    .sheet{height:62%}
    .proj{grid-template-columns:1fr}
    .ph.land{grid-column:auto}
    .gallery{grid-template-columns:repeat(2,1fr)}
    .x-inner{padding:0 18px 90px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition-duration:.01s!important} }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<main class="app">
  <section class="stage" id="stage" aria-live="polite">
    <div class="stage-inner" id="stageInner">
      <div class="view active" id="home">
        <div class="layer" data-depth="12"><div class="ring"></div></div>
        <!-- swap assets/me.webp for the wisuda photo later (transparent background) -->
        <div class="layer" data-depth="26"><img class="person" src="assets/me.webp" alt="Portrait of Haiqal Dwikusuma"></div>
        <div class="layer" data-depth="48">
          <span class="chip" style="left:9%;top:20%"><i style="background:var(--sun)"></i>React · Next.js</span>
          <span class="chip" style="right:7%;top:31%"><i style="background:var(--pink)"></i>AI APIs</span>
          <span class="chip" style="left:5%;top:56%"><i style="background:var(--cobalt)"></i>UGM CS '26</span>
          <span class="chip" style="right:6%;top:64%"><i style="background:#2BD974"></i>IISMA @ MSU</span>
        </div>
      </div>
      <div class="view" id="preview"></div>
    </div>
  </section>

  <aside class="panel">
    <header>
      <p class="hello">Hi, I'm</p>
      <h1>Haiqal<br><span>Dwikusuma.</span></h1>
      <p class="tagline">Computer Science graduate from Universitas Gadjah Mada. I build responsive web apps with React &amp; Next.js and like plugging AI into real products.</p>
      <span class="status"><i></i>#OpenToWork</span>
    </header>
    <nav class="menu" id="menu" aria-label="Sections"></nav>
  </aside>
</main>

<div class="expand" id="expand" role="dialog" aria-modal="true" aria-label="Section"><div id="xHero"></div><div class="x-inner" id="xInner"></div></div>
<button class="x-close" id="xClose" aria-label="Close">✕</button>
<div class="lb" id="lb" role="dialog" aria-label="Photo"><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure></div>

<script>
/* ---------- photos: [file, colour pulled from the photo, caption] ---------- */
const P = {
  'kkn-team':['photos/kkn-team','#4489E4','KKN team in Poncol, Magetan'],
  'kkn-meeting':['photos/kkn-meeting','#E49B44','Village meeting during KKN'],
  'kkn-crew':['photos/kkn-crew','#E4CC44','Pre-KKN introduction, meeting the team'],
  'msu-grad':['photos/msu-grad','#20DFA7','Completing the American Semester Program at MSU'],
  'msu-cert':['photos/msu-cert','#20DFDF','Michigan State certificate'],
  'iisma-cohort':['photos/iisma-cohort','#E17C2C','IISMA MSU cohort'],
  'iisma-depart':['photos/iisma-depart','#E4D544','IISMA MSU awardees'],
  'beach':['photos/beach','#206DDF','Lake Michigan, flying the Spartan flag'],
  'spartan':['photos/spartan','#448BE4','Spartan Stadium'],
  'stadium':['photos/stadium','#44A1E4','Game day at Spartan Stadium'],
  'band':['photos/band','#E47B44','Rascal Teenagers, live'],
  'filming':['photos/filming','#DF2067','Behind the camera'],
  'culture-night':['photos/culture-night','#E25A34','Indonesian Cultural Night at MSU'],

/* ---------- colour ---------- */
function setAccent(c){
  root.style.setProperty('--accent', c);

/* ---------- glass tiles: hover a tile to change the photo and colour ---------- */
let G = null;
function startGlass(s){
  const tiles = [...document.querySelectorAll('#gTiles .g-tile')];
  G = {s, tiles, sel:-1, touched:false, timer:0};
  const select = i => {
    if (!G || i === G.sel) return;
    G.sel = i;
    tiles.forEach((t,j)=>t.classList.toggle('sel', j===i));
    const it = s.items[i];
    setAccent(it.img ? col(it.img) : s.c);
    setStagePhoto(it.img);
  };
  tiles.forEach((t,i)=>t.addEventListener('mouseenter', ()=>{ G.touched = true; select(i); }));
  select(0);
  /* Drag the sheet down to reveal the photo, up to bring the tiles back.
     You can grab it anywhere except on a tile/button (big hit area); clicking the handle toggles it. */
  const sheet = $('#sheet'), grab = $('#grab');
  const PEEK = 58;
  let drag = null, suppressClick = false;
  const maxOff = () => sheet.offsetHeight - PEEK;
  sheet.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    suppressClick = false;
    const onHandle = !!e.target.closest('#grab');
    if (!onHandle && !sheet.classList.contains('collapsed') && e.target.closest('.g-tile, .pv-cta')) return;
    G.touched = true;
    drag = {y:e.clientY, start: sheet.classList.contains('collapsed') ? maxOff() : 0, off:null, moved:false, onHandle, id:e.pointerId};
    sheet.setPointerCapture(e.pointerId); sheet.classList.add('dragging');
    e.preventDefault();
  });
  sheet.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y; if (Math.abs(dy) > 5) drag.moved = true;
    if (!drag.moved) return;
    drag.off = Math.min(Math.max(drag.start + dy, 0), maxOff());
    sheet.style.transform = `translateY(${drag.off}px)`;
  });
  const endDrag = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    sheet.classList.remove('dragging'); sheet.style.transform = '';
    const wasCollapsed = sheet.classList.contains('collapsed');
    let collapse = wasCollapsed;
    if (drag.moved && drag.off !== null){
      // flick-friendly: a short drag in either direction is enough
      const moved = drag.off - drag.start;
      collapse = Math.abs(moved) > 40 ? moved > 0 : wasCollapsed;
      suppressClick = true;
    } else if (drag.onHandle || wasCollapsed){
      collapse = !wasCollapsed; suppressClick = true;    // a click on the handle (or the collapsed strip) toggles
    }
    sheet.classList.toggle('collapsed', collapse);
    drag = null;
  };
  sheet.addEventListener('pointerup', endDrag); sheet.addEventListener('pointercancel', endDrag);
  sheet.addEventListener('lostpointercapture', endDrag);
  sheet.addEventListener('click', e => { if (suppressClick){ suppressClick = false; e.stopPropagation(); } });   // dragging never opens the page
  /* gently cycles through the tiles until you hover one */
  if (!reduce) G.timer = setInterval(()=>{ if (G && !G.touched) select((G.sel+1) % tiles.length); }, 3200);
}
