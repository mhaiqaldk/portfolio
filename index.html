<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haiqal Dwikusuma</title>
<meta name="description" content="Portfolio of Muhammad Haiqal Dwikusuma, Computer Science graduate (UGM) and web developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @property --accent { syntax:'<color>'; inherits:true; initial-value:#FF5A1F; }
  @property --on     { syntax:'<color>'; inherits:true; initial-value:#FFFFFF; }
  @property --a2     { syntax:'<color>'; inherits:true; initial-value:#3D5BFF; }
  @property --a3     { syntax:'<color>'; inherits:true; initial-value:#FF3D8B; }

  :root{
    --bg:#0F0E13; --surface:#1A1922; --surface2:#24222E; --text:#F6F2EA; --muted:#B7B2C2; --line:rgba(255,255,255,.12);
    --brand:#FF5A1F; --cobalt:#3D5BFF; --pink:#FF3D8B; --sun:#FFC531;
    --accent:#FF5A1F; --on:#FFFFFF; --a2:#3D5BFF; --a3:#FF3D8B;
    --glass:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.16);
    --ease:cubic-bezier(.2,.8,.2,1);
    transition:--accent .6s var(--ease), --on .6s var(--ease), --a2 .9s var(--ease), --a3 .9s var(--ease);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  h1,h2,h3,h4{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.02em}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  img{display:block;max-width:100%}

  /* ---------- BACKGROUND: glow when idle, the selected photo full-bleed when a section is open ---------- */
  .aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aura i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
  .aura .b1{width:46vw;aspect-ratio:1;right:-8vw;top:18vh;background:var(--accent)}
  .aura .b2{width:38vw;aspect-ratio:1;left:30vw;top:-16vh;background:var(--a2);animation-delay:-6s}
  .aura .b3{width:36vw;aspect-ratio:1;left:-8vw;bottom:-14vh;background:var(--a3);animation-delay:-12s}
  @keyframes drift{to{transform:translate(-8%,8%) scale(1.15)}}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg img{position:absolute;inset:-2%;width:104%;height:104%;max-width:none;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .9s var(--ease),transform 9s ease-out}
  .bg img.on{opacity:1;transform:scale(1)}
  /* home shuffle: slow iPhone-style drift, each photo from a different corner */
  .bg img.kb{transition:opacity 1.4s var(--ease),transform 9s linear;transform:scale(1.14)}
  .bg img.kb.on{transform:scale(1.02)}
  .bg img.kb.o1{transform-origin:20% 30%}.bg img.kb.o2{transform-origin:80% 25%}
  .bg img.kb.o3{transform-origin:30% 80%}.bg img.kb.o4{transform-origin:75% 70%}
  .bg img.shot{filter:blur(10px) brightness(.8);transition:opacity .9s var(--ease),transform 9s ease-out,filter .5s}
  body.peek .bg img.shot{filter:none;object-fit:contain}
  .bg-tint{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--accent);mix-blend-mode:multiply;opacity:0;transition:opacity .6s}
  .bg-shade{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;
            background:linear-gradient(90deg,rgba(10,9,14,.8) 0%,rgba(10,9,14,.3) 42%,rgba(10,9,14,.55) 100%),linear-gradient(0deg,rgba(10,9,14,.65),transparent 45%)}
  body.has-photo .bg-tint{opacity:.32}
  body.has-photo .bg-shade{opacity:1}
  body.peek .bg-shade{opacity:.2}
  body.peek .bg-tint{opacity:0}

  /* ---------- LAYOUT ---------- */
  .app{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:44px;height:100vh;padding:32px 40px}
  .identity{display:flex;flex-direction:column;justify-content:flex-end;min-height:0;transition:opacity .45s var(--ease)}

  /* the badge: you, popping out of a colour ring */
  .badge{--size:min(26vw,36vh);position:relative;width:var(--size);aspect-ratio:1;margin:calc(var(--size) * .3) 0 24px 10px;flex:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .disc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--cobalt),var(--pink),var(--sun),var(--cobalt));animation:spin 24s linear infinite}
  .disc::after{content:"";position:absolute;inset:7%;border-radius:50%;background:var(--brand)}
  @keyframes spin{to{rotate:360deg}}
  .bust{position:absolute;left:0;right:0;bottom:0;height:128%;overflow:hidden;border-radius:0 0 50% 50% / 0 0 39% 39%}
  .bust img{position:absolute;bottom:0;left:50%;translate:-50% 0;height:100%;width:auto;max-width:none}
  .chip{position:absolute;padding:7px 13px;border-radius:999px;background:rgba(15,14,19,.85);font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
  body.selected .badge{opacity:0;transform:translateY(26px) scale(.94);pointer-events:none}

  .hello{font-size:15px;color:var(--muted);font-weight:500}
  .identity h1{font-size:clamp(44px,5.2vw,86px);line-height:.93;margin-top:6px}
  .identity h1 span{color:var(--accent)}
  .tagline{margin-top:14px;font-size:16px;color:#DCD7CE;line-height:1.5;max-width:42ch}
  .status{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:8px 16px 8px 12px;border-radius:999px;background:#2E7D32;color:#fff;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(46,125,50,.35);align-self:flex-start}
  .status i{width:8px;height:8px;border-radius:50%;background:#B9F6CA;animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,246,202,.7)}70%,100%{box-shadow:0 0 0 8px rgba(185,246,202,0)}}

  /* photo controls: caption + "view photo" (only when a photo is showing) */
  .photo-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .4s,transform .4s var(--ease)}
  body.has-photo .photo-ctl{opacity:1;transform:none;pointer-events:auto}
  .glass-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;
              background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
  .glass-pill i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .peek-btn:hover{background:rgba(255,255,255,.16)}
  body.peek .identity > :not(.photo-ctl), body.peek .cc{opacity:0;pointer-events:none}
  body.peek .identity > :not(.photo-ctl){transform:translateY(-6px)}
  .identity > *{transition:opacity .45s var(--ease),transform .45s var(--ease)}

  /* ---------- CONTROL CENTER grid ---------- */
  .cc{align-self:center;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(100px,auto);grid-auto-flow:row dense;gap:12px;
      max-height:calc(100vh - 64px);overflow:auto;padding:4px;scrollbar-width:none;transition:opacity .45s var(--ease)}
  .cc::-webkit-scrollbar{display:none}
  .mod{position:relative;display:flex;flex-direction:column;border-radius:26px;background:var(--glass);border:1px solid var(--glass-line);overflow:hidden;
       -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.18);
       transition:background .4s,border-color .4s,opacity .4s}
  .mod:hover{background:rgba(255,255,255,.13)}
  .m-about{grid-column:span 2;grid-row:span 2}
  .m-projects,.m-journey,.m-contact{grid-column:span 2}
  .m-play{grid-column:span 4}
  .m-skills,.m-cv{grid-column:span 1}
  .mod-head{position:relative;width:100%;flex:1 0 auto;min-height:100px;text-align:left;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
  .mod-head .num{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
  .mod-head .num em{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .mod-head .lbl{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(20px,1.8vw,30px);line-height:1}
  .m-about .mod-head .lbl{font-size:clamp(28px,2.6vw,42px)}
  .mod-head .sub{display:block;font-size:13px;color:var(--muted);margin-top:6px}
  .mod-head .plus{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;
                  background:rgba(255,255,255,.1);transition:transform .45s var(--ease),background .3s}
  .mod:hover .plus{background:rgba(255,255,255,.2)}
  .mod-head:focus-visible{outline:3px solid var(--text);outline-offset:-3px;border-radius:26px}

  .mod.open{grid-column:1 / -1;grid-row:auto;background:color-mix(in srgb,var(--accent) 20%,rgba(255,255,255,.07));border-color:color-mix(in srgb,var(--accent) 65%,transparent)}
  .mod.open .mod-head{flex:none;min-height:0;padding-bottom:6px;gap:8px}
  .mod.open .plus{transform:rotate(45deg);background:var(--accent);color:var(--on)}
  .cc.has-open .mod:not(.open){opacity:.72}
  .cc.has-open .mod:not(.open):hover{opacity:1}
  .mod-body{display:none;padding:0 18px 18px}
  .mod.open .mod-body{display:block;animation:bodyIn .5s var(--ease) .08s both}
  @keyframes bodyIn{from{opacity:0;transform:translateY(10px)}}
  .mod-body h3{font-size:clamp(22px,2vw,30px);line-height:1.1;margin:2px 0 12px;max-width:24ch}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .item{text-align:left;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
        transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
  .item:hover{transform:translateY(-2px)}
  .item b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px;line-height:1.15}
  .item span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.4;opacity:.82;margin-top:3px}
  .item.on{background:var(--accent);color:var(--on);border-color:transparent}
  .mod-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}
  .open-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--on);font-weight:600;font-size:14px}
  .mod-foot small{font-size:12px;color:var(--muted)}

  /* shared bits used by the full pages */
  .pv-tint{position:absolute;inset:0;background:var(--accent);mix-blend-mode:multiply;opacity:.38}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

  /* ---------- EXPANDED PAGE ---------- */
  .expand{position:fixed;inset:0;z-index:50;background:var(--bg);visibility:hidden;clip-path:inset(0 round 0);overflow:auto}
  .expand.anim{transition:clip-path .65s var(--ease)}
  .expand.show{visibility:visible}
  .x-close{position:fixed;top:22px;right:22px;z-index:60;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on);font-size:20px;opacity:0;pointer-events:none;transition:opacity .3s}
  .expand.ready ~ .x-close{opacity:1;pointer-events:auto}
  .hero{position:relative;height:46vh;min-height:300px;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover}
  .hero .pv-tint{opacity:.45}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,14,19,.1),var(--bg))}
  .hero.plain{height:22vh;min-height:140px;background:radial-gradient(90% 120% at 20% 0%,var(--accent),var(--bg) 70%)}
  .x-inner{position:relative;max-width:1100px;margin:-120px auto 0;padding:0 28px 110px;opacity:0;transform:translateY(24px);transition:opacity .4s .15s,transform .5s .15s var(--ease)}
  .expand.ready .x-inner{opacity:1;transform:none}
  .x-inner > h2{font-size:clamp(44px,6.4vw,92px);line-height:.95;margin:10px 0 22px}
  .x-inner > h2 span{color:var(--accent)}
  h3{font-size:26px;margin-bottom:6px}
  .lead{font-size:clamp(17px,1.6vw,20px);line-height:1.6;max-width:62ch;color:#DCD7CE}
  .muted{color:var(--muted)}
  .block{margin-top:56px}
  .block > p{max-width:64ch;line-height:1.6;color:#DCD7CE;margin-top:6px}
  .meta{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}
  .card{background:var(--surface);border-radius:24px;padding:22px;border:1px solid var(--line)}
  .card p,.card li{font-size:15px;line-height:1.55;color:#CFCAD8}
  .card ul{padding-left:18px;margin-top:10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--on);text-decoration:none;font-weight:600;font-size:14px}
  .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}

  /* photos: hovering one recolours the page to that photo's colour */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
  .ph{position:relative;margin:0;border-radius:18px;overflow:hidden;background:var(--surface);cursor:zoom-in;aspect-ratio:4/5;outline:3px solid transparent;outline-offset:3px;transition:outline-color .3s,transform .4s var(--ease)}
  .ph.land{aspect-ratio:16/10;grid-column:span 2}
  .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
  .ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;font-size:13px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
  .ph:hover{outline-color:var(--pc);transform:translateY(-3px)}
  .ph:hover img{transform:scale(1.05)}
  .ph::after{content:"";position:absolute;top:12px;right:12px;width:12px;height:12px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px rgba(0,0,0,.25)}

  .proj{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:center}
  .proj .ph{aspect-ratio:4/3;cursor:zoom-in}
  .proj .ph::after{display:none}
  .soon{aspect-ratio:4/3;border-radius:18px;display:grid;place-items:center;color:var(--muted);font-size:13px;background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 12px,var(--surface2) 12px,var(--surface2) 24px)}
  .timeline{margin-top:32px;border-left:2px solid var(--line);padding-left:30px;display:grid;gap:22px}
  .timeline .card{position:relative}
  .timeline .card::before{content:"";position:absolute;left:-41px;top:26px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid var(--bg)}
  .videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px;margin-top:18px}
  .vid-card h4{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;margin-top:12px}
  .vid-card p{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
  .ph.vid{aspect-ratio:16/9;cursor:pointer}
  .ph.vid figcaption{display:none}
  .ph.vid .play{position:absolute;left:50%;top:50%;translate:-50% -50%;width:64px;height:64px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
  .ph.vid:hover .play{transform:scale(1.1)}
  .ph.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .cv-frame{width:100%;height:80vh;border:0;border-radius:20px;background:#fff;margin-top:24px}
  .contact-list{display:grid;gap:14px;margin-top:28px}
  .contact-list a{display:flex;justify-content:space-between;align-items:center;padding:24px 26px;border-radius:24px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(20px,2.6vw,32px);font-weight:600;transition:transform .3s var(--ease),background .3s,color .3s}
  .contact-list a:hover{transform:translateX(6px);background:var(--accent);color:var(--on)}
  .contact-list small{font-family:Inter,sans-serif;font-size:13px;font-weight:500;opacity:.7;display:block}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:40px;background:color-mix(in srgb,var(--accent) 30%,#09080C);opacity:0;pointer-events:none;transition:opacity .35s}
  .lb.open{opacity:1;pointer-events:auto;cursor:zoom-out}
  /* video player: big 16:9 frame on a tinted backdrop (black bars blend into the frame) */
  .vb.open{cursor:default}
  .vframe{width:min(1100px,92vw,calc((100vh - 150px) * 16 / 9));aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.55);transform:scale(.96);transition:transform .45s var(--ease)}
  .vb.open .vframe{transform:none}
  .vframe iframe{width:100%;height:100%;border:0;display:block}
  .vb-close{position:fixed;top:22px;right:22px;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on);font-size:20px}
  .lb figure{display:grid;gap:14px;justify-items:center;max-height:100%}
  .lb img{max-height:calc(100vh - 140px);max-width:min(1100px,100%);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.96);transition:transform .45s var(--ease)}
  .lb.open img{transform:none}
  .lb figcaption{font-weight:600;color:#fff}


  /* ---------- small screens: same idea, stacked ---------- */
  @media (max-width:900px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;height:auto;min-height:100vh;padding:20px 16px 28px;gap:24px}
    .identity{min-height:auto}
    .badge{--size:min(64vw,320px);margin:calc(var(--size) * .3) auto 22px}
    .cc{max-height:none;overflow:visible;grid-template-columns:repeat(2,minmax(0,1fr))}
    .m-about,.m-play{grid-column:span 2;grid-row:auto}
    .m-projects,.m-journey,.m-contact{grid-column:span 2}
    .items{grid-template-columns:1fr}
    .bg-shade{background:linear-gradient(0deg,rgba(10,9,14,.75),rgba(10,9,14,.35))}
    .proj{grid-template-columns:1fr}
    .ph.land{grid-column:auto}
    .gallery{grid-template-columns:repeat(2,1fr)}
    .x-inner{padding:0 18px 90px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition-duration:.01s!important} }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="bg-tint" aria-hidden="true"></div>
<div class="bg-shade" aria-hidden="true"></div>

<main class="app">
  <section class="identity" aria-label="About Haiqal">
    <div class="badge">
      <div class="disc"></div>
      <!-- swap assets/me.webp for the wisuda photo later (transparent background) -->
      <div class="bust"><img src="assets/me.webp" alt="Portrait of Haiqal Dwikusuma"></div>
      <span class="chip" style="left:-6%;top:22%"><i style="background:var(--sun)"></i>React · Next.js</span>
      <span class="chip" style="right:-10%;top:40%"><i style="background:var(--pink)"></i>AI APIs</span>
      <span class="chip" style="left:-10%;top:66%"><i style="background:#2BD974"></i>IISMA @ MSU</span>
    </div>
    <p class="hello">Hi, I'm</p>
    <h1>Haiqal<br><span>Dwikusuma.</span></h1>
    <p class="tagline">Computer Science graduate from Universitas Gadjah Mada. I build responsive web apps with React &amp; Next.js and like plugging AI into real products.</p>
    <span class="status"><i></i>#OpenToWork</span>
    <div class="photo-ctl">
      <button class="glass-pill peek-btn" id="peekBtn" aria-pressed="false">👁 <span id="peekLbl">View photo</span></button>
      <span class="glass-pill"><i></i><span id="bgCap"></span></span>
    </div>
  </section>

  <nav class="cc" id="cc" aria-label="Sections"></nav>
</main>

const KEYS = Object.keys(S);
const coverColor = k => { const it = S[k].items.find(i => i.img); return it ? col(it.img) : S[k].c; };
const firstImg = k => (S[k].items.find(i => i.img) || {}).img || null;

const $ = s => document.querySelector(s);
const root = document.documentElement, body = document.body;
const cc = $('#cc'), bg = $('#bg'), bgCap = $('#bgCap');
const expand = $('#expand'), xInner = $('#xInner'), xHero = $('#xHero'), xClose = $('#xClose');
const lb = $('#lb'), lbImg = $('#lbImg'), lbCap = $('#lbCap');
const canHover = matchMedia('(hover: hover)').matches;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let sel = null, itemIdx = -1, touched = false, cycle = 0, isOpen = false, pageColor = null, openFrom = null;

/* ---------- colour ---------- */
function setAccent(c){
  root.style.setProperty('--accent', c);
  const n = parseInt(c.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  root.style.setProperty('--on', (0.2126*r + 0.7152*g + 0.0722*b)/255 > .6 ? '#0F0E13' : '#FFFFFF');
}
function setGlow(k){
  let cs = ['#3D5BFF','#FF3D8B'];
  if (k){
    const own = [...new Set(S[k].items.filter(i=>i.img).map(i=>col(i.img)))].slice(1);
    cs = [own[0] || S[k].c, own[1] || own[0] || S[k].c];
  }
  root.style.setProperty('--a2', cs[0]); root.style.setProperty('--a3', cs[1]);
}

/* ---------- full-page background photo ---------- */
let bgKey = null;
function setBg(key){
  if (key === bgKey) return;
  bgKey = key;
  [...bg.children].forEach(im => { im.classList.remove('on'); setTimeout(() => im.remove(), 950); });
  body.classList.toggle('has-photo', !!key);
  if (!key){ exitPeek(); return; }
  bgCap.textContent = cap(key);
  const im = new Image(); im.alt = ''; im.src = src(key);
  if (P[key][0].startsWith('shots/')) im.classList.add('shot');
  if (!sel) im.classList.add('kb', 'o' + (1 + Math.floor(Math.random()*4)));
  bg.appendChild(im);
  (im.decode ? im.decode() : Promise.resolve()).catch(()=>{}).then(() => { if (bgKey === key) requestAnimationFrame(() => im.classList.add('on')); });
}

/* ---------- home photo shuffle: when no section is open, the background cycles through photos ---------- */
const SHUFFLE = ['nyc-night','beach','band','culture-night','kkn-team','lighthouse','chicago','stadium','parade-banner',
                 'snowman','pisa','train','kkn-crew','nyc-day','msu-grad','iisma-cohort','parade-selfie','spartan'];
let shufTimer = 0, shufStart = 0, shufOrder = [], shufPos = 0;
function nextShuffle(){
  if (sel || isOpen || body.classList.contains('peek') || document.hidden) return;   // pauses while you look at something
  if (shufPos >= shufOrder.length){
    shufOrder = SHUFFLE.slice().sort(() => Math.random() - .5);
    if (shufOrder[0] === bgKey) shufOrder.push(shufOrder.shift());                 // no instant repeat
    shufPos = 0;
  }
  const k = shufOrder[shufPos++];
  setAccent(col(k)); setBg(k);
}
function startShuffle(delay = 0){
  stopShuffle();
  shufStart = setTimeout(() => { nextShuffle(); shufTimer = setInterval(nextShuffle, 7000); }, delay);
}
function stopShuffle(){ clearTimeout(shufStart); clearInterval(shufTimer); }

/* ---------- modules ---------- */
cc.innerHTML = KEYS.map(k => { const s = S[k]; return `
  <section class="mod m-${k}" data-key="${k}" style="--c:${coverColor(k)}">
    <button class="mod-head" aria-expanded="false">
      <span class="num"><em></em>${s.num}</span>
      <span><span class="lbl">${s.label}</span><span class="sub">${s.sub}</span></span>
      <span class="plus" aria-hidden="true">+</span>
    </button>
    <div class="mod-body">
      <h3>${s.title}</h3>
      <div class="items">${s.items.map((it,i)=>`<button class="item" data-i="${i}"><b>${it.t}</b><span>${it.d}</span></button>`).join('')}</div>
      <div class="mod-foot"><button class="open-btn">Open ${s.label} ↗</button></div>
    </div>
  </section>`; }).join('');
const mods = [...cc.querySelectorAll('.mod')];
const modOf = k => mods.find(m => m.dataset.key === k);

/* smooth re-layout: every module glides from its old spot to its new one */
function flip(mutate){
  const first = new Map(mods.map(m => [m, m.getBoundingClientRect()]));
  mutate();
  if (reduce) return;
  mods.forEach(m => {
    const a = first.get(m), b = m.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    m.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:520, easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}

function select(k){
  if (k === sel) k = null;                       // clicking the open module closes it
  flip(() => {
    mods.forEach(m => { const on = m.dataset.key === k; m.classList.toggle('open', on); m.querySelector('.mod-head').setAttribute('aria-expanded', on); });
    cc.classList.toggle('has-open', !!k);
  });
  sel = k; body.classList.toggle('selected', !!k);
  clearInterval(cycle);
  if (!k){ setGlow(null); startShuffle(500); return; }
  stopShuffle();
  setGlow(k); touched = false; itemIdx = -1; pickItem(0);
  /* gently walk through the items until you interact */
  if (!reduce) cycle = setInterval(() => { if (!touched && sel === k) pickItem((itemIdx + 1) % S[k].items.length); }, 3800);
  const m = modOf(k);
  if (innerWidth <= 900) setTimeout(() => m.scrollIntoView({behavior:'smooth', block:'start'}), 60);
  else setTimeout(() => { const r = m.getBoundingClientRect(), c = cc.getBoundingClientRect(); if (r.bottom > c.bottom || r.top < c.top) m.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 540);
}
function pickItem(i){
  const s = S[sel]; if (!s) return;
  itemIdx = i;
  modOf(sel).querySelectorAll('.item').forEach((b,j) => b.classList.toggle('on', j === i));
  const it = s.items[i];
  setAccent(it.img ? col(it.img) : s.c);
  setBg(it.img || null);
}

cc.addEventListener('click', e => {
  const m = e.target.closest('.mod'); if (!m) return;
  const k = m.dataset.key;
  if (e.target.closest('.mod-head')) return select(k);
  if (e.target.closest('.open-btn')) return open(k, m);
  const it = e.target.closest('.item');
  if (it){
    const i = +it.dataset.i; touched = true;
    if (!canHover && i !== itemIdx) return pickItem(i);   // touch: first tap previews
    pickItem(i); open(k, m);
  }
});
/* mousemove (not mouseover): items only react when you actually move the mouse,
   never because the layout slid an item under a resting cursor */
/* ...and only once the pointer settles on an item for a moment, so sweeping across
   items on the way somewhere else (e.g. to "View photo") doesn't change anything */
let dwell = 0, dwellOn = -1;
cc.addEventListener('mousemove', e => {
  const it = e.target.closest('.item');
  if (!it || !sel || it.closest('.mod').dataset.key !== sel){ clearTimeout(dwell); dwellOn = -1; return; }
  const i = +it.dataset.i;
  if (i === dwellOn) return;
  clearTimeout(dwell); dwellOn = i;
  dwell = setTimeout(() => { if (i !== itemIdx || !touched){ touched = true; pickItem(i); } }, 140);
});
cc.addEventListener('mouseleave', () => { clearTimeout(dwell); dwellOn = -1; });

/* ---------- view photo (fade the glass away) ---------- */
const peekBtn = $('#peekBtn'), peekLbl = $('#peekLbl');
function enterPeek(){ body.classList.add('peek'); peekBtn.setAttribute('aria-pressed','true'); peekLbl.textContent = 'Back'; touched = true; }
function exitPeek(){ body.classList.remove('peek'); peekBtn.setAttribute('aria-pressed','false'); peekLbl.textContent = 'View photo'; }
peekBtn.addEventListener('click', e => { e.stopPropagation(); body.classList.contains('peek') ? exitPeek() : enterPeek(); });
document.addEventListener('click', e => { if (body.classList.contains('peek') && !e.target.closest('#peekBtn')) exitPeek(); });

/* ---------- expand a section to a full page (grows out of its module) ---------- */
function insetOf(el){
  const r = el.getBoundingClientRect();
  return `inset(${r.top}px ${innerWidth - r.right}px ${innerHeight - r.bottom}px ${r.left}px round 26px)`;
}
function open(k, fromEl){
  if (isOpen) return;
  isOpen = true; openFrom = fromEl || modOf(k);
  const s = S[k];
  pageColor = s.hero ? col(s.hero) : s.c;
  setAccent(pageColor);
  xHero.innerHTML = s.hero ? `<div class="hero"><img src="${src(s.hero)}" alt=""><div class="pv-tint"></div></div>` : `<div class="hero plain"></div>`;
  xInner.innerHTML = page(k);
  expand.scrollTop = 0;
  expand.classList.remove('anim','ready');
  expand.style.clipPath = insetOf(openFrom);
  expand.classList.add('show');
  expand.getBoundingClientRect();
  expand.classList.add('anim');
  expand.style.clipPath = 'inset(0px 0px 0px 0px round 0px)';
  setTimeout(() => { expand.classList.add('ready'); xClose.focus({preventScroll:true}); }, 380);
}
function close(){
  if (!isOpen) return;
  expand.classList.remove('ready');
  expand.style.clipPath = insetOf(openFrom);
  setTimeout(() => {
    expand.classList.remove('show','anim'); isOpen = false;
    if (sel && itemIdx >= 0) pickItem(itemIdx); else if (bgKey) setAccent(col(bgKey)); else setAccent('#FF5A1F');
    openFrom && openFrom.querySelector('.mod-head').focus({preventScroll:true});
  }, 650);
}
xClose.addEventListener('click', close);

/* inside a page: hovering a photo recolours the page; clicking opens it big (videos play inline) */
expand.addEventListener('mouseover', e => { const f = e.target.closest('.ph'); if (f) setAccent(col(f.dataset.k)); });
expand.addEventListener('mouseout', e => {
  if (lb.classList.contains('open') || vb.classList.contains('open')) return;   // keep the opened photo/video's colour
  const f = e.target.closest('.ph'); if (f && !f.contains(e.relatedTarget) && pageColor) setAccent(pageColor);
});
expand.addEventListener('click', e => {
  const f = e.target.closest('.ph'); if (!f) return;
  if (f.dataset.v) return openVid(f.dataset.k, f.dataset.v);
  openLb(f.dataset.k);
});
const vb = $('#vb'), vFrame = $('#vFrame'), vCap = $('#vCap');
function openVid(k, id){
  setAccent(col(k)); vCap.textContent = cap(k);

}
function closeVid(){ vb.classList.remove('open'); setTimeout(() => { if (!vb.classList.contains('open')) vFrame.innerHTML = ''; }, 350); if (pageColor) setAccent(pageColor); }
vb.addEventListener('click', e => { if (e.target === vb || e.target.closest('#vbClose')) closeVid(); });
function openLb(k){ setAccent(col(k)); lbImg.src = src(k); lbImg.alt = cap(k); lbCap.textContent = cap(k); lb.classList.add('open'); }
function closeLb(){ lb.classList.remove('open'); if (pageColor) setAccent(pageColor); }
lb.addEventListener('click', closeLb);

  if (e.key !== 'Escape') return;
